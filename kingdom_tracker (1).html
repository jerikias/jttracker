<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0d0b;
  --bg2: #161410;
  --bg3: #1e1b16;
  --bg4: #252118;
  --card: #1a1710;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --gold3: #f5e0a0;
  --text: #f0ead8;
  --muted: #8a8070;
  --muted2: #6a6055;
  --pillars: #c9a84c,#7c6fd4,#4a9eca,#3db88a,#d4537e,#4fc4a0,#e87a3a,#e84a5a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* TOP NAV */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 0.5px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}
.logo {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.08em;
}
.date-str {
  font-size: 11px;
  color: var(--muted);
}
.view-toggle {
  display: flex;
  gap: 4px;
  background: var(--bg3);
  border-radius: 20px;
  padding: 3px;
}
.vbtn {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 16px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all .2s;
}
.vbtn.active {
  background: var(--bg4);
  color: var(--gold);
}

/* VIEWS */
.view { display: none; }
.view.active { display: block; }

/* ===== OVERVIEW VIEW ===== */
.overview-hero {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Donut chart area */
.donut-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}
.donut-svg-wrap { position: relative; flex-shrink: 0; }
.donut-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  pointer-events: none;
}
.donut-pct { font-size: 22px; font-weight: 600; color: var(--gold2); }
.donut-lbl { font-size: 10px; color: var(--muted); }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
.legend-row {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; cursor: pointer;
}
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-name { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.legend-pct { color: var(--muted); font-size: 11px; min-width: 28px; text-align: right; }

/* Pillar bars grid */
.pillars-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.pillar-bar-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: border-color .2s;
}
.pillar-bar-card:hover { border-color: var(--border2); }
.pbh { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.pb-icon { font-size: 16px; }
.pb-name { font-size: 11px; font-weight: 500; color: var(--text); flex: 1; }
.pb-count { font-size: 11px; color: var(--muted); }
.pbar-track {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.pbar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .6s ease;
}

/* streak + quote */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.stat-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
  transition: border-color .2s;
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: var(--gold); }
.stat-num { font-size: 22px; font-weight: 600; color: var(--gold2); }
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

.verse-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-left: 2px solid var(--gold);
  border-radius: 0 12px 12px 0;
  padding: 14px;
}
.verse-text { font-size: 12px; color: var(--text); line-height: 1.6; font-style: italic; }
.verse-ref { font-size: 11px; color: var(--gold); margin-top: 6px; }

/* ===== PILLARS VIEW ===== */
.pillar-tabs {
  display: flex;
  overflow-x: auto;
  padding: 12px 16px 0;
  gap: 6px;
  scrollbar-width: none;
  border-bottom: 0.5px solid var(--border);
}
.pillar-tabs::-webkit-scrollbar { display: none; }
.ptab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 20px 20px 0 0;
  border: 0.5px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  transition: all .2s;
  border-bottom: none;
}
.ptab.active {
  background: var(--card);
  color: var(--text);
  border-color: var(--border);
  border-bottom-color: var(--card);
  margin-bottom: -1px;
}
.ptab-icon { font-size: 14px; }

.pillar-panel { display: none; padding: 16px; }
.pillar-panel.active { display: block; }

.pp-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.pp-icon { font-size: 26px; }
.pp-title { font-size: 16px; font-weight: 600; color: var(--text); }
.pp-subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; }
.pp-progress {
  background: var(--bg3);
  border-radius: 6px;
  height: 6px;
  margin-bottom: 14px;
  overflow: hidden;
}
.pp-progress-fill {
  height: 100%;
  border-radius: 6px;
  transition: width .6s ease;
}

.section-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.section-title { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.add-btn {
  font-size: 11px;
  color: var(--gold);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  padding: 0;
}

/* Checklist items */
.checklist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg3);
  border-radius: 10px;
  border: 0.5px solid transparent;
  transition: all .15s;
  cursor: pointer;
}
.check-item:hover { border-color: var(--border); }
.check-item.done { opacity: 0.55; }
.check-box {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--muted2);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.check-item.done .check-box {
  background: var(--gold);
  border-color: var(--gold);
}
.check-mark { font-size: 10px; color: #000; display: none; }
.check-item.done .check-mark { display: block; }
.check-label { font-size: 13px; flex: 1; line-height: 1.4; }
.check-item.done .check-label { text-decoration: line-through; color: var(--muted); }
.del-btn {
  background: none; border: none; color: var(--muted2);
  font-size: 14px; cursor: pointer; padding: 0 2px;
  opacity: 0;
  transition: opacity .15s;
}
.check-item:hover .del-btn { opacity: 1; }

/* ===== DAILY VIEW ===== */
.daily-wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.time-block {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.tb-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
}
.tb-time { font-size: 11px; color: var(--gold); font-weight: 500; min-width: 70px; }
.tb-title { font-size: 13px; font-weight: 500; flex: 1; }
.tb-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: var(--bg3); color: var(--muted);
}
.tb-chevron { font-size: 12px; color: var(--muted); transition: transform .2s; }
.tb-header.open .tb-chevron { transform: rotate(180deg); }
.tb-body { display: none; padding: 0 14px 12px; }
.tb-body.open { display: block; }
.tb-tasks { display: flex; flex-direction: column; gap: 5px; }
.tb-task {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: var(--bg3); border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
}
.tb-task:hover { background: var(--bg4); }
.tb-task-cb {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--muted2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.tb-task.done .tb-task-cb { background: var(--gold); border-color: var(--gold); }
.tb-task-cm { font-size: 9px; color: #000; display: none; }
.tb-task.done .tb-task-cm { display: block; }
.tb-task-lbl { font-size: 12px; flex: 1; }
.tb-task.done .tb-task-lbl { text-decoration: line-through; color: var(--muted); }
.tb-pillar-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ===== ADD MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 32px;
  width: 100%;
  max-width: 480px;
  animation: slideup .25s ease;
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.modal input, .modal select {
  width: 100%; padding: 11px 12px;
  background: var(--bg);
  border: 0.5px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  margin-bottom: 10px;
}
.modal-btns { display: flex; gap: 8px; margin-top: 4px; }
.mbtn {
  flex: 1; padding: 11px; border-radius: 10px;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; border: none;
}
.mbtn-cancel { background: var(--bg); color: var(--muted); }
.mbtn-add { background: var(--gold); color: #000; font-weight: 600; }

/* bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex;
  background: var(--bg2);
  border-top: 0.5px solid var(--border);
  padding: 10px 0 env(safe-area-inset-bottom, 10px);
  z-index: 100;
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  background: none; border: none;
  color: var(--muted2);
  font-size: 10px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  padding: 4px 0;
  transition: color .2s;
}
.bnav-btn.active { color: var(--gold); }
.bnav-icon { font-size: 20px; }

body { padding-bottom: 72px; }

/* ===== PROGRESS VIEW ===== */
.progress-wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.period-toggle { display: flex; background: var(--bg3); border-radius: 20px; padding: 3px; gap: 3px; }
.pbtn {
  flex: 1; font-size: 12px; padding: 6px; border-radius: 16px;
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s;
}
.pbtn.active { background: var(--bg4); color: var(--gold); }

/* Calendar heatmap */
.heatmap-card {
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 14px;
}
.heatmap-title { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
.heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.hmap-day {
  aspect-ratio: 1; border-radius: 4px; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--muted2); cursor: pointer;
  transition: transform .15s;
  position: relative;
}
.hmap-day:hover { transform: scale(1.15); z-index: 2; }
.hmap-day.today { outline: 1.5px solid var(--gold); }
.hmap-weekday { font-size: 9px; color: var(--muted2); text-align: center; padding-bottom: 4px; }

/* Pillar weekly bars */
.weekly-bars { display: flex; flex-direction: column; gap: 8px; }
.wbar-row { display: flex; align-items: center; gap: 8px; }
.wbar-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.wbar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.wbar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.wbar-pct { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }

/* Monthly ring chart */
.monthly-rings { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.mring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.mring-label { font-size: 10px; color: var(--muted); text-align: center; }

/* Goals & milestones */
.goals-list { display: flex; flex-direction: column; gap: 8px; }
.goal-item {
  background: var(--bg3); border-radius: 10px;
  border: 0.5px solid transparent;
  padding: 12px; cursor: pointer;
  transition: border-color .15s;
}
.goal-item:hover { border-color: var(--border); }
.goal-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.goal-icon { font-size: 14px; }
.goal-title { font-size: 13px; font-weight: 500; flex: 1; }
.goal-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--bg4); color: var(--muted); }
.goal-progress { background: var(--bg4); border-radius: 3px; height: 4px; overflow: hidden; margin-bottom: 4px; }
.goal-progress-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
.goal-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.goal-del { background: none; border: none; color: var(--muted2); font-size: 13px; cursor: pointer; opacity: 0; transition: opacity .15s; }
.goal-item:hover .goal-del { opacity: 1; }

/* Milestone timeline */
.milestone-list { display: flex; flex-direction: column; gap: 0; }
.milestone-item { display: flex; gap: 12px; padding: 8px 0; position: relative; }
.milestone-item:not(:last-child)::before {
  content: ''; position: absolute; left: 7px; top: 28px; bottom: -8px;
  width: 1px; background: var(--border);
}
.ms-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--bg3); border: 1.5px solid var(--muted2);
  flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
}
.ms-dot.done { background: var(--gold); border-color: var(--gold); }
.ms-dot-inner { width: 6px; height: 6px; border-radius: 50%; background: #000; display: none; }
.ms-dot.done .ms-dot-inner { display: block; }
.ms-body { flex: 1; }
.ms-title { font-size: 13px; font-weight: 500; }
.ms-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ms-del { background: none; border: none; color: var(--muted2); font-size: 12px; cursor: pointer; opacity: 0; transition: opacity .15s; padding: 2px 4px; }
.milestone-item:hover .ms-del { opacity: 1; }

/* Streak modal */
.streak-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.streak-modal-overlay.open { display: flex; }
.streak-modal {
  background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 360px;
  animation: fadein .2s ease;
}
@keyframes fadein { from { opacity:0; transform: scale(.95); } to { opacity:1; transform:scale(1); } }
.sm-header { text-align: center; margin-bottom: 18px; }
.sm-flame { font-size: 40px; }
.sm-streak { font-size: 36px; font-weight: 600; color: var(--gold2); }
.sm-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sm-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.sm-stat { background: var(--bg4); border-radius: 10px; padding: 10px; text-align: center; }
.sm-stat-n { font-size: 18px; font-weight: 600; color: var(--gold2); }
.sm-stat-l { font-size: 10px; color: var(--muted); margin-top: 2px; }
.sm-mini-hmap { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 16px; }
.sm-hday { aspect-ratio:1; border-radius: 3px; background: var(--bg4); }
.sm-hday.active { background: var(--gold); }
.sm-hday.partial { background: var(--gold)+'88'; }
.sm-close { width: 100%; padding: 11px; border-radius: 10px; border: none; background: var(--gold); color: #000; font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

/* Subtle grain overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">KINGDOM</span>
  <span class="date-str" id="dateStr"></span>
  <div class="view-toggle">
    <button class="vbtn active" onclick="setView('overview')">Overview</button>
    <button class="vbtn" onclick="setView('pillars')">Pillars</button>
    <button class="vbtn" onclick="setView('daily')">Daily</button>
    <button class="vbtn" onclick="setView('progress')">Progress</button>
  </div>
</div>

<!-- ===== OVERVIEW ===== -->
<div class="view active" id="view-overview">
  <div class="overview-hero">

    <div class="donut-wrap">
      <div class="donut-svg-wrap">
        <svg id="donutSvg" width="110" height="110" viewBox="0 0 110 110"></svg>
        <div class="donut-center">
          <div class="donut-pct" id="totalPct">0%</div>
          <div class="donut-lbl">today</div>
        </div>
      </div>
      <div class="donut-legend" id="donutLegend"></div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-lbl">Done today</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-lbl">Total tasks</div>
      </div>
      <div class="stat-card clickable" onclick="openStreakModal()" title="View streak details">
        <div class="stat-num" id="statStreak">1</div>
        <div class="stat-lbl">🔥 Day streak</div>
      </div>
    </div>

    <div class="pillars-grid" id="pillarsGrid"></div>

    <div class="verse-card">
      <div class="verse-text">"Commit to the Lord whatever you do, and He will establish your plans."</div>
      <div class="verse-ref">Proverbs 16:3</div>
    </div>

  </div>
</div>

<!-- ===== PILLARS ===== -->
<div class="view" id="view-pillars">
  <div class="pillar-tabs" id="pillarTabs"></div>
  <div id="pillarPanels"></div>
</div>

<!-- ===== DAILY ===== -->
<div class="view" id="view-daily">
  <div class="daily-wrap" id="dailyWrap"></div>
</div>

<!-- ===== PROGRESS VIEW ===== -->
<div class="view" id="view-progress">
  <div class="progress-wrap">
    <div class="period-toggle">
      <button class="pbtn active" id="pbtn-daily" onclick="setPeriod('daily')">Daily</button>
      <button class="pbtn" id="pbtn-weekly" onclick="setPeriod('weekly')">Weekly</button>
      <button class="pbtn" id="pbtn-monthly" onclick="setPeriod('monthly')">Monthly</button>
    </div>
    <div id="progress-content"></div>
  </div>
</div>

<!-- STREAK MODAL -->
<div class="streak-modal-overlay" id="streakModal">
  <div class="streak-modal">
    <div class="sm-header">
      <div class="sm-flame">🔥</div>
      <div class="sm-streak" id="smStreak">1</div>

const DEFAULT_TASKS = {

  ],

const TIME_BLOCKS = [
  { label:'🌅 Dawn', time:'5–7am', pillarIds:['spirit'] },
  { label:'📖 Morning', time:'7–9am', pillarIds:['bible','spirit'] },
  { label:'🎵 Creative', time:'9am–12pm', pillarIds:['music','bible','apps'] },
  { label:'📈 Work', time:'12–3pm', pillarIds:['money','apps'] },
  { label:'🇨🇳 Learning', time:'3–5pm', pillarIds:['learn'] },
  { label:'💪 Body', time:'5–7pm', pillarIds:['health'] },
  { label:'🌙 Evening', time:'7–10pm', pillarIds:['spirit','love','learn'] },
];

// ============================================================
// STATE + STORAGE
// ============================================================
const TODAY = new Date().toISOString().slice(0,10);

function loadState() {
  try {
    const raw = localStorage.getItem('kingdom_v3');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveState() {
  try { localStorage.setItem('kingdom_v3', JSON.stringify(STATE)); } catch(e) {}
}

let STATE = loadState();
if (!STATE) {
  STATE = { tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)), streak: 1, lastDate: TODAY };
} else {
  // Reset daily done if new day
  if (STATE.lastDate !== TODAY) {
    // archive and reset
    const allDone = Object.values(STATE.tasks).flat().every(t => t.done);
    if (allDone || STATE.lastDate) {
      // just reset done flags
      Object.keys(STATE.tasks).forEach(pid => {
        STATE.tasks[pid].forEach(t => t.done = false);
      });
    }
    STATE.streak = (STATE.lastDate === getPrevDay(TODAY)) ? (STATE.streak||1)+1 : 1;
    STATE.lastDate = TODAY;
    saveState();
  }
}

function getPrevDay(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate()-1);
  return dt.toISOString().slice(0,10);
}

// ============================================================
// HELPERS
// ============================================================
function getPillar(id) { return PILLARS.find(p => p.id === id); }
function allTasks() { return Object.entries(STATE.tasks).flatMap(([pid, tasks]) => tasks.map(t => ({...t, pid}))); }
function doneTasks() { return allTasks().filter(t => t.done); }
function totalTasks() { return allTasks().length; }

// ============================================================
// VIEWS — see updated setView in progress section below
// ============================================================
let currentView = 'overview';

// ============================================================
// OVERVIEW
// ============================================================
function renderOverview() {
  document.getElementById('dateStr').textContent = new Date().toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});

  const done = doneTasks().length;
  const total = totalTasks();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('totalPct').textContent = pct + '%';
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statStreak').textContent = STATE.streak;

  // Donut
  renderDonut();

  // Pillar bars
  const grid = document.getElementById('pillarsGrid');
  grid.innerHTML = '';
  PILLARS.forEach(p => {
    const tasks = STATE.tasks[p.id] || [];
    const pdone = tasks.filter(t=>t.done).length;
    const ptotal = tasks.length;
    const ppct = ptotal ? Math.round(pdone/ptotal*100) : 0;
    const card = document.createElement('div');
    card.className = 'pillar-bar-card';
    card.onclick = () => { setView('pillars'); setTimeout(()=>selectPillarTab(p.id),50); };
    card.innerHTML = `
      <div class="pbh">
        <span class="pb-icon">${p.icon}</span>
        <span class="pb-name">${p.name.split(' ').slice(0,2).join(' ')}</span>
        <span class="pb-count">${pdone}/${ptotal}</span>
      </div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${ppct}%;background:${p.color}"></div></div>
    `;
    grid.appendChild(card);
  });
}

function renderDonut() {
  const svg = document.getElementById('donutSvg');
  const legend = document.getElementById('donutLegend');
  svg.innerHTML = '';
  legend.innerHTML = '';

  const cx=55, cy=55, r=42, sw=12;
  const circ = 2*Math.PI*r;

  const segments = PILLARS.map(p => {
    const tasks = STATE.tasks[p.id]||[];
    const done = tasks.filter(t=>t.done).length;
    return { p, count: tasks.length, done };
  }).filter(s => s.count > 0);

  const totalItems = segments.reduce((a,s)=>a+s.count,0);
  let offset = -Math.PI/2;

  segments.forEach(s => {
    const fraction = s.count / totalItems;
    const angle = fraction * 2 * Math.PI;
    const dashLen = fraction * circ;
    const dashOffset = -(offset - (-Math.PI/2)) / (2*Math.PI) * circ;

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',cx); circle.setAttribute('cy',cy); circle.setAttribute('r',r);
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke', s.done/s.count > 0.5 ? s.p.color : s.p.color+'55');
    circle.setAttribute('stroke-width',sw);
    circle.setAttribute('stroke-dasharray', dashLen + ' ' + (circ - dashLen));
    circle.setAttribute('stroke-dashoffset', circ * 0.25 - offset/(2*Math.PI)*circ);
    circle.setAttribute('transform',`rotate(${offset*180/Math.PI - 90} ${cx} ${cy})`);
    circle.style.transition = 'stroke-dasharray .6s ease';

    // re-draw cleanly using rotation transform
    const startDeg = offset * 180/Math.PI;
    const c2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c2.setAttribute('cx',cx); c2.setAttribute('cy',cy); c2.setAttribute('r',r);
    c2.setAttribute('fill','none');
    c2.setAttribute('stroke', s.done > 0 ? s.p.color : s.p.color+'44');
    c2.setAttribute('stroke-width',sw);
    c2.setAttribute('stroke-dasharray', `${dashLen} ${circ}`);
    c2.setAttribute('stroke-dashoffset', circ/4);
    c2.setAttribute('transform',`rotate(${startDeg*180/Math.PI} ${cx} ${cy})`);

    // simpler approach: just compute manually
    svg.appendChild(c2);
    offset += angle;

    // legend
    const pct = Math.round(s.done/s.count*100);
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.onclick = () => { setView('pillars'); setTimeout(()=>selectPillarTab(s.p.id),50); };
    row.innerHTML = `<span class="legend-dot" style="background:${s.p.color}"></span><span class="legend-name">${s.p.name.split(' ')[0]}</span><span class="legend-pct">${pct}%</span>`;
    legend.appendChild(row);
  });

  // bg circle
  const bgc = document.createElementNS('http://www.w3.org/2000/svg','circle');
  bgc.setAttribute('cx',cx); bgc.setAttribute('cy',cy); bgc.setAttribute('r',r);
  bgc.setAttribute('fill','none'); bgc.setAttribute('stroke','#252118'); bgc.setAttribute('stroke-width',sw);
  svg.insertBefore(bgc, svg.firstChild);

  // redo properly with cumulative offset
  svg.innerHTML = '';
  svg.appendChild(bgc);

  let cumAngle = 0;
  segments.forEach(s => {
    const fraction = s.count / totalItems;
    const dashLen = fraction * circ;
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',cx); circle.setAttribute('cy',cy); circle.setAttribute('r',r);
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke', s.done > 0 ? s.p.color : s.p.color+'44');
    circle.setAttribute('stroke-width',sw);
    circle.setAttribute('stroke-dasharray', `${dashLen} ${circ}`);
    circle.setAttribute('stroke-dashoffset', circ/4);
    circle.setAttribute('transform', `rotate(${cumAngle} ${cx} ${cy})`);
    svg.appendChild(circle);
    cumAngle += fraction * 360;
  });
}

// ============================================================
// PILLARS
// ============================================================
let activePillarTab = 'spirit';

function renderPillars() {
  renderPillarTabs();
  renderPillarPanels();
  selectPillarTab(activePillarTab);
}

function renderPillarTabs() {
  const tabs = document.getElementById('pillarTabs');

    const btn = document.createElement('button');
    btn.className = 'ptab';

function selectPillarTab(id) {

function renderPillarPanels() {
  const container = document.getElementById('pillarPanels');
  container.innerHTML = '';
  PILLARS.forEach(p => {
    const tasks = STATE.tasks[p.id] || [];
    const done = tasks.filter(t=>t.done).length;
    const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;

    const panel = document.createElement('div');
    panel.className = 'pillar-panel';
    panel.id = 'ppanel-'+p.id;

    const taskHTML = tasks.map(t => `
      <div class="check-item${t.done?' done':''}" id="ci-${t.id}" onclick="toggleTask('${p.id}','${t.id}')">
        <div class="check-box"><span class="check-mark">✓</span></div>
        <span class="check-label">${t.label}</span>
        <button class="del-btn" onclick="event.stopPropagation();deleteTask('${p.id}','${t.id}')">✕</button>
      </div>
    `).join('');

    panel.innerHTML = `
      <div class="pp-header">
        <span class="pp-icon">${p.icon}</span>
        <div>
          <div class="pp-title">${p.name}</div>
          <div class="pp-subtitle">${p.sub}</div>
        </div>
      </div>
      <div class="pp-progress"><div class="pp-progress-fill" style="width:${pct}%;background:${p.color}"></div></div>
      <div class="section-hdr">
        <span class="section-title">${done}/${tasks.length} done · ${pct}%</span>
        <button class="add-btn" onclick="openModal('${p.id}')">+ Add task</button>
      </div>
      <div class="checklist" id="checklist-${p.id}">${taskHTML}</div>
    `;
    container.appendChild(panel);
  });
}

// ============================================================
// DAILY
// ============================================================
function renderDaily() {
  const wrap = document.getElementById('dailyWrap');
  wrap.innerHTML = '';

  TIME_BLOCKS.forEach((block, bi) => {
    const relTasks = block.pillarIds.flatMap(pid => (STATE.tasks[pid]||[]).map(t=>({...t,pid})));
    const done = relTasks.filter(t=>t.done).length;

    const el = document.createElement('div');
    el.className = 'time-block';

    const taskHTML = relTasks.map(t => {
      const p = getPillar(t.pid);
      return `
        <div class="tb-task${t.done?' done':''}" onclick="toggleTask('${t.pid}','${t.id}');renderDaily()">
          <div class="tb-task-cb"><span class="tb-task-cm">✓</span></div>
          <span class="tb-pillar-dot" style="background:${p.color}"></span>
          <span class="tb-task-lbl">${t.label}</span>
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="tb-header" onclick="toggleBlock(this)">
        <span class="tb-time">${block.time}</span>
        <span class="tb-title">${block.label}</span>
        <span class="tb-badge">${done}/${relTasks.length}</span>

function toggleBlock(header) {
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

// TASK ACTIONS — moved to updated toggleTask above
// ============================================================

function deleteTask(pid, tid) {
  STATE.tasks[pid] = (STATE.tasks[pid]||[]).filter(t=>t.id!==tid);
  saveState();
  renderPillarPanels();
  selectPillarTab(pid);
}

// ============================================================
// ADD MODAL
// ============================================================
let modalPid = 'spirit';
function openModal(pid) {
  modalPid = pid;
  document.getElementById('newTaskInput').value = '';
  const sel = document.getElementById('newTaskPillar');
  sel.innerHTML = PILLARS.map(p=>`<option value="${p.id}"${p.id===pid?' selected':''}>${p.icon} ${p.name}</option>`).join('');
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('newTaskInput').focus(),100);
}
function closeModal() { document.getElementById('addModal').classList.remove('open'); }
document.getElementById('addModal').addEventListener('click', e => { if (e.target === document.getElementById('addModal')) closeModal(); });

function addTask() {
  const label = document.getElementById('newTaskInput').value.trim();
  const pid = document.getElementById('newTaskPillar').value;
  if (!label) return;
  const id = pid + '_' + Date.now();
  if (!STATE.tasks[pid]) STATE.tasks[pid] = [];
  STATE.tasks[pid].push({id, label, done:false});
  saveState();
  closeModal();
  renderPillarPanels();
  selectPillarTab(pid);
}

document.getElementById('newTaskInput').addEventListener('keydown', e => { if (e.key==='Enter') addTask(); });

// ============================================================
// UPDATED setView — handle progress
// ============================================================
const _origSetView = setView;
// override
function setView(v) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.vbtn').forEach((b,i) => {
    b.classList.toggle('active', ['overview','pillars','daily','progress'][i] === v);
  });
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bn-'+v);
  if (bn) bn.classList.add('active');
  if (v === 'overview') renderOverview();
  if (v === 'pillars') renderPillars();
  if (v === 'daily') renderDaily();
  if (v === 'progress') renderProgress();
}

// ============================================================
// HISTORY — track completed % per day
// ============================================================
function snapshotToday() {
  const done = doneTasks().length;
  const total = totalTasks();
  const pct = total ? Math.round(done/total*100) : 0;
  const perPillar = {};
  PILLARS.forEach(p => {
    const tasks = STATE.tasks[p.id]||[];
    const d = tasks.filter(t=>t.done).length;
    perPillar[p.id] = tasks.length ? Math.round(d/tasks.length*100) : 0;
  });
  if (!STATE.history) STATE.history = {};
  STATE.history[TODAY] = { pct, perPillar, done, total };
  saveState();
}

// call snapshot on every task toggle
const _origToggleTask = toggleTask;
function toggleTask(pid, tid) {
  const task = (STATE.tasks[pid]||[]).find(t=>t.id===tid);
  if (task) {
    task.done = !task.done;
    saveState();
    snapshotToday();
    if (currentView === 'overview') renderOverview();
    if (currentView === 'pillars') {
      const tasks = STATE.tasks[pid]||[];
      const done = tasks.filter(t=>t.done).length;
      const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
      const fill = document.querySelector(`#ppanel-${pid} .pp-progress-fill`);
      if (fill) fill.style.width = pct+'%';
      const hdr = document.querySelector(`#ppanel-${pid} .section-title`);
      if (hdr) hdr.textContent = `${done}/${tasks.length} done · ${pct}%`;
      const ci = document.getElementById('ci-'+tid);
      if (ci) ci.classList.toggle('done', task.done);
    }
    if (currentView === 'progress') renderProgress();
  }
}

// ============================================================
// STREAK MODAL
// ============================================================
function openStreakModal() {
  const history = STATE.history || {};
  const days = Object.keys(history).sort();
  const totalDays = days.length;
  const best = STATE.bestStreak || STATE.streak || 1;
  // last 21 days for mini heatmap
  const hmap = document.getElementById('smHmap');
  hmap.innerHTML = '';
  for (let i = 20; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const entry = history[key];
    const div = document.createElement('div');
    div.className = 'sm-hday';
    if (entry) {
      div.style.background = entry.pct >= 80 ? '#c9a84c' : entry.pct >= 40 ? '#c9a84c88' : '#c9a84c44';
    }
    if (key === TODAY) div.style.outline = '1.5px solid #fff';
    hmap.appendChild(div);
  }
  // this week %
  let weekDone = 0, weekDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    if (history[key]) { weekDone += history[key].pct; weekDays++; }
  }
  const weekAvg = weekDays ? Math.round(weekDone/weekDays) : 0;
  document.getElementById('smStreak').textContent = STATE.streak || 1;
  document.getElementById('smBest').textContent = Math.max(best, STATE.streak||1);
  document.getElementById('smTotal').textContent = totalDays || 1;
  document.getElementById('smWeek').textContent = weekAvg+'%';
  document.getElementById('streakModal').classList.add('open');
}
function closeStreakModal() { document.getElementById('streakModal').classList.remove('open'); }
document.getElementById('streakModal').addEventListener('click', e => {
  if (e.target === document.getElementById('streakModal')) closeStreakModal();
});

// ============================================================
// PROGRESS VIEW
// ============================================================
let currentPeriod = 'daily';
function setPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('pbtn-'+p).classList.add('active');
  renderProgressContent();
}
function renderProgress() { renderProgressContent(); }

function renderProgressContent() {
  const c = document.getElementById('progress-content');
  c.innerHTML = '';
  const history = STATE.history || {};

  if (currentPeriod === 'daily') renderDailyProgress(c, history);
  else if (currentPeriod === 'weekly') renderWeeklyProgress(c, history);
  else renderMonthlyProgress(c, history);

  // Goals section always visible
  renderGoalsSection(c);
  renderMilestonesSection(c);
}

function renderDailyProgress(c, history) {
  // 30-day heatmap
  const hcard = document.createElement('div');
  hcard.className = 'heatmap-card';
  const weekdays = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let gridHTML = weekdays.map(d=>`<div class="hmap-weekday">${d}</div>`).join('');
  // pad to start of week
  const today = new Date();
  const day0 = new Date(today); day0.setDate(today.getDate()-29);
  const startPad = day0.getDay();
  for (let i=0;i<startPad;i++) gridHTML += `<div></div>`;
  for (let i=29;i>=0;i--) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const entry = history[key];
    const pct = entry ? entry.pct : 0;
    const bg = pct >= 80 ? '#c9a84c' : pct >= 50 ? '#c9a84c99' : pct >= 20 ? '#c9a84c55' : pct > 0 ? '#c9a84c22' : 'var(--bg3)';
    const isToday = key === TODAY;
    gridHTML += `<div class="hmap-day${isToday?' today':''}" style="background:${bg}" title="${key}: ${pct}%">${d.getDate()}</div>`;
  }
  hcard.innerHTML = `<div class="heatmap-title">Last 30 days — completion heatmap</div><div class="heatmap-grid">${gridHTML}</div>`;
  c.appendChild(hcard);

  // Today per-pillar
  const todayEntry = history[TODAY];
  if (todayEntry && todayEntry.perPillar) {
    const bcard = document.createElement('div');
    bcard.className = 'heatmap-card';
    bcard.innerHTML = `<div class="heatmap-title">Today — pillar breakdown</div><div class="weekly-bars" id="todayBars"></div>`;
    c.appendChild(bcard);
    setTimeout(() => {
      const wrap = document.getElementById('todayBars');
      if (!wrap) return;
      PILLARS.forEach(p => {
        const pct = todayEntry.perPillar[p.id] || 0;
        const row = document.createElement('div');
        row.className = 'wbar-row';
        row.innerHTML = `<span class="wbar-icon">${p.icon}</span><div class="wbar-track"><div class="wbar-fill" style="width:${pct}%;background:${p.color}"></div></div><span class="wbar-pct">${pct}%</span>`;
        wrap.appendChild(row);
      });
    }, 0);
  }
}

function renderWeeklyProgress(c, history) {
  // Last 8 weeks as bar chart
  const wcard = document.createElement('div');
  wcard.className = 'heatmap-card';
  let barsHTML = '';
  const weeks = [];
  for (let w=7;w>=0;w--) {
    let sum=0, cnt=0;
    for (let d=0;d<7;d++) {
      const dt = new Date(); dt.setDate(dt.getDate()-(w*7+d));
      const key = dt.toISOString().slice(0,10);
      if (history[key]) { sum+=history[key].pct; cnt++; }
    }
    const avg = cnt ? Math.round(sum/cnt) : 0;
    const wStart = new Date(); wStart.setDate(wStart.getDate()-w*7-6);
    weeks.push({avg, label: wStart.toLocaleDateString('en',{month:'short',day:'numeric'})});
  }
  const maxH = 80;
  barsHTML = `<div style="display:flex;align-items:flex-end;gap:6px;height:${maxH+30}px;padding:0 4px;">` +
    weeks.map(w => {
      const h = Math.max(4, Math.round(w.avg/100*maxH));
      const isLast = weeks.indexOf(w) === weeks.length-1;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
        <span style="font-size:10px;color:var(--muted)">${w.avg}%</span>
        <div style="width:100%;height:${h}px;background:${isLast?'var(--gold)':'#c9a84c55'};border-radius:4px 4px 0 0;transition:height .5s ease"></div>
        <span style="font-size:9px;color:var(--muted2);text-align:center;writing-mode:horizontal-tb">${w.label}</span>
      </div>`;
    }).join('') + '</div>';
  wcard.innerHTML = `<div class="heatmap-title">8-week completion average</div>${barsHTML}`;
  c.appendChild(wcard);

  // Weekly pillar breakdown
  const pcard = document.createElement('div');
  pcard.className = 'heatmap-card';
  pcard.innerHTML = `<div class="heatmap-title">This week — pillar focus</div><div class="weekly-bars" id="weekBars"></div>`;
  c.appendChild(pcard);
  setTimeout(() => {
    const wrap = document.getElementById('weekBars');
    if (!wrap) return;
    PILLARS.forEach(p => {
      let sum=0,cnt=0;
      for (let d=0;d<7;d++) {
        const dt=new Date(); dt.setDate(dt.getDate()-d);
        const key=dt.toISOString().slice(0,10);
        if (history[key]?.perPillar?.[p.id] !== undefined) { sum+=history[key].perPillar[p.id]; cnt++; }
      }
      const avg = cnt ? Math.round(sum/cnt) : 0;
      const row = document.createElement('div');
      row.className = 'wbar-row';
      row.innerHTML = `<span class="wbar-icon">${p.icon}</span><div class="wbar-track"><div class="wbar-fill" style="width:${avg}%;background:${p.color}"></div></div><span class="wbar-pct">${avg}%</span>`;
      wrap.appendChild(row);
    });
  }, 0);
}

function renderMonthlyProgress(c, history) {
  // Monthly ring for each pillar
  const rcard = document.createElement('div');
  rcard.className = 'heatmap-card';
  rcard.innerHTML = `<div class="heatmap-title">This month — per pillar</div><div class="monthly-rings" id="monthRings"></div>`;
  c.appendChild(rcard);
  setTimeout(() => {
    const wrap = document.getElementById('monthRings');
    if (!wrap) return;
    const month = TODAY.slice(0,7);
    PILLARS.forEach(p => {
      let sum=0,cnt=0;
      Object.keys(history).filter(k=>k.startsWith(month)).forEach(k => {
        if (history[k]?.perPillar?.[p.id] !== undefined) { sum+=history[k].perPillar[p.id]; cnt++; }
      });
      const avg = cnt ? Math.round(sum/cnt) : 0;
      const div = document.createElement('div');
      div.className = 'mring-wrap';
      div.onclick = () => { setView('pillars'); setTimeout(()=>selectPillarTab(p.id),50); };
      const r=22, circ=2*Math.PI*r, fill=avg/100*circ;
      div.innerHTML = `
        <svg width="60" height="60" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="7"/>
          <circle cx="30" cy="30" r="${r}" fill="none" stroke="${p.color}" stroke-width="7"
            stroke-dasharray="${fill} ${circ}" stroke-dashoffset="${circ/4}"
            stroke-linecap="round" transform="rotate(-90 30 30)"/>
          <text x="30" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="${p.color}">${avg}%</text>
        </svg>
        <span class="mring-label">${p.icon} ${p.name.split(' ')[0]}</span>`;
      wrap.appendChild(div);
    });
  }, 0);

  // Month trend bar chart
  const mcard = document.createElement('div');
  mcard.className = 'heatmap-card';
  const months = [];
  for (let m=5;m>=0;m--) {
    const d=new Date(); d.setMonth(d.getMonth()-m);
    const key=d.toISOString().slice(0,7);
    const days=Object.keys(history).filter(k=>k.startsWith(key));
    const avg = days.length ? Math.round(days.reduce((a,k)=>a+(history[k].pct||0),0)/days.length) : 0;
    months.push({avg, label:d.toLocaleDateString('en',{month:'short'})});
  }
  const maxH=70;
  const barsHTML = `<div style="display:flex;align-items:flex-end;gap:8px;height:${maxH+30}px;padding:0 4px;">` +
    months.map((m,i)=>{
      const h=Math.max(4,Math.round(m.avg/100*maxH));
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
        <span style="font-size:10px;color:var(--muted)">${m.avg}%</span>
        <div style="width:100%;height:${h}px;background:${i===months.length-1?'var(--gold)':'#c9a84c44'};border-radius:4px 4px 0 0;transition:height .5s"></div>
        <span style="font-size:10px;color:var(--muted2)">${m.label}</span>
      </div>`;
    }).join('') + '</div>';
  mcard.innerHTML = `<div class="heatmap-title">6-month trend</div>${barsHTML}`;
  c.appendChild(mcard);
}

// ============================================================
// GOALS
// ============================================================
function renderGoalsSection(c) {
  const goals = STATE.goals || [];
  const section = document.createElement('div');
  section.className = 'heatmap-card';
  let goalsHTML = goals.length === 0 ?
    `<div style="font-size:12px;color:var(--muted);text-align:center;padding:12px 0">No goals yet — add your first one</div>` :
    `<div class="goals-list">${goals.map(g => {
      const p = getPillar(g.pid);
      const pct = g.target ? Math.min(100, Math.round(g.progress/g.target*100)) : 0;
      const typeLabel = g.type === 'daily' ? 'Daily' : g.type === 'weekly' ? 'Weekly' : 'Monthly';
      return `<div class="goal-item" id="goal-${g.id}">
        <div class="goal-header">
          <span class="goal-icon">${p ? p.icon : '🎯'}</span>
          <span class="goal-title">${g.title}</span>
          <span class="goal-badge" style="background:${p?p.color+'33':'var(--bg4)'};color:${p?p.color:'var(--muted)'}">${typeLabel}</span>
          <button class="goal-del" onclick="deleteGoal('${g.id}')">✕</button>
        </div>
        <div class="goal-progress"><div class="goal-progress-fill" style="width:${pct}%;background:${p?p.color:'var(--gold)'}"></div></div>
        <div class="goal-meta"><span>${g.progress}/${g.target} ${g.type==='daily'?'days':g.type==='weekly'?'weeks':'months'}</span><span>${pct}%</span></div>
      </div>`;
    }).join('')}</div>`;
  section.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="heatmap-title" style="margin:0">Goals</div>
      <button class="add-btn" onclick="openGoalModal()">+ Add goal</button>
    </div>
    ${goalsHTML}`;
  c.appendChild(section);
}

function openGoalModal() {
  document.getElementById('goalTitleInput').value='';
  document.getElementById('goalTargetInput').value='';
  const sel=document.getElementById('goalPillarSel');
  sel.innerHTML=PILLARS.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
  document.getElementById('addGoalModal').classList.add('open');
}
function closeGoalModal() { document.getElementById('addGoalModal').classList.remove('open'); }
document.getElementById('addGoalModal').addEventListener('click',e=>{if(e.target===document.getElementById('addGoalModal'))closeGoalModal();});

function addGoal() {
  const title=document.getElementById('goalTitleInput').value.trim();
  const pid=document.getElementById('goalPillarSel').value;
  const type=document.getElementById('goalTypeSel').value;
  const target=parseInt(document.getElementById('goalTargetInput').value)||30;
  if(!title) return;
  if(!STATE.goals) STATE.goals=[];
  STATE.goals.push({id:'g'+Date.now(),title,pid,type,target,progress:0});
  saveState(); closeGoalModal(); renderProgressContent();
}
function deleteGoal(id) {
  STATE.goals=(STATE.goals||[]).filter(g=>g.id!==id);
  saveState(); renderProgressContent();
}
function incrementGoal(id) {
  const g=(STATE.goals||[]).find(g=>g.id===id);
  if(g && g.progress<g.target){g.progress++;saveState();renderProgressContent();}
}

// ============================================================
// MILESTONES
// ============================================================
function renderMilestonesSection(c) {
  const ms = (STATE.milestones||[]).sort((a,b)=>a.date>b.date?1:-1);
  const section = document.createElement('div');
  section.className = 'heatmap-card';
  let msHTML = ms.length === 0 ?
    `<div style="font-size:12px;color:var(--muted);text-align:center;padding:12px 0">No milestones yet</div>` :
    `<div class="milestone-list">${ms.map(m=>{
      const p=getPillar(m.pid);
      const isPast=m.date<=TODAY;
      return `<div class="milestone-item">
        <div class="ms-dot${m.done?' done':''}" onclick="toggleMilestone('${m.id}')"><div class="ms-dot-inner"></div></div>
        <div class="ms-body">
          <div class="ms-title" style="color:${p?p.color:'var(--text)'}">${m.title}</div>
          <div class="ms-date">${p?p.icon+' ':''} ${m.date}${isPast&&!m.done?' · overdue':''}${m.done?' · ✓ completed':''}</div>
        </div>
        <button class="ms-del" onclick="deleteMilestone('${m.id}')">✕</button>
      </div>`;
    }).join('')}</div>`;
  section.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="heatmap-title" style="margin:0">Milestones</div>
      <button class="add-btn" onclick="openMsModal()">+ Add milestone</button>
    </div>
    ${msHTML}`;
  c.appendChild(section);
}

function openMsModal() {
  document.getElementById('msTitleInput').value='';
  document.getElementById('msDateInput').value=TODAY;
  const sel=document.getElementById('msPillarSel');
  sel.innerHTML=PILLARS.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
  document.getElementById('addMsModal').classList.add('open');
}
function closeMsModal() { document.getElementById('addMsModal').classList.remove('open'); }
document.getElementById('addMsModal').addEventListener('click',e=>{if(e.target===document.getElementById('addMsModal'))closeMsModal();});

function addMilestone() {
  const title=document.getElementById('msTitleInput').value.trim();
  const date=document.getElementById('msDateInput').value;
  const pid=document.getElementById('msPillarSel').value;
  if(!title||!date) return;
  if(!STATE.milestones) STATE.milestones=[];
  STATE.milestones.push({id:'ms'+Date.now(),title,date,pid,done:false});
  saveState(); closeMsModal(); renderProgressContent();
}
function deleteMilestone(id) {
  STATE.milestones=(STATE.milestones||[]).filter(m=>m.id!==id);
  saveState(); renderProgressContent();
}
function toggleMilestone(id) {
  const m=(STATE.milestones||[]).find(m=>m.id===id);
  if(m){m.done=!m.done;saveState();renderProgressContent();}
}

// snapshot today on load
snapshotToday();

// ============================================================
// INIT
// ============================================================
document.getElementById('dateStr').textContent = new Date().toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
renderOverview();
</script>
</body>
