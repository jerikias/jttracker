<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2229"><title>Kingdom Flow</title>
<style>
:root{--bg:#0f2229;--card:#173039;--line:#2a4d5a;--tx:#eef3ef;--mut:#8fb0b3;--gold:#e8b64c;--grn:#4fd1a1;--red:#ef6f6c;--blu:#6db3f2;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 0}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700}
#app{max-width:760px;margin:auto;padding:12px 12px 90px}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
header h1{font-size:22px;color:var(--gold);flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mut);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px}.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea,button{font:inherit;color:var(--tx);background:#0f2229;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
input,select,textarea{flex:1 1 120px}textarea{width:100%;min-height:70px}
input[type=checkbox]{flex:none;width:20px;height:20px;accent-color:var(--grn)}
button{cursor:pointer;flex:none}button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#241a00;font-weight:700;border-color:var(--gold)}
button.stop{background:var(--red);color:#2a0a09;font-weight:700;border-color:var(--red)}
button.mic.on{background:var(--red);animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
button.sm{padding:3px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.bar{height:9px;background:#0f2229;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .5s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1a1f;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:11px 2px;color:var(--mut);font-size:12px}
nav button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.big{font:700 40px Georgia,serif;letter-spacing:1px}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:#0f2229;border:1px solid var(--line);color:var(--mut)}
.tag.outcome{color:var(--gold)}.tag.process{color:var(--blu)}.tag.learning{color:var(--grn)}
.hab{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1f3f4a}
.hab.d span{text-decoration:line-through;color:var(--mut)}
.warn{border-color:var(--gold);background:#2a2713}
.mot{border-left:4px solid var(--gold);font-family:Georgia,serif;font-size:16px}
.cols{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:80px}
.cols i{background:var(--blu);border-radius:2px 2px 0 0;min-height:2px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:#0f2229}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;left:10px;max-width:380px;margin-left:auto;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--gold);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #0008;animation:s .3s}
@keyframes s{from{transform:translateX(60px);opacity:0}}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#off{position:fixed;left:10px;bottom:64px;background:var(--red);color:#2a0a09;border-radius:99px;padding:2px 10px;font-size:12px;display:none;z-index:6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><header><h1>Kingdom Flow</h1><span class="chip" id="lvl"></span><span class="chip" id="syn">local</span></header><main id="main"></main></div>
<div id="off">Offline - saving locally</div><div id="toasts"></div>
<nav id="nav"></nav>
<datalist id="cats"></datalist>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const dstr=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const K='kflow1',HZ=['year','quarter','month','week','day'],TY=['outcome','process','learning'];
const PIL=['God & Spirit','KIAS Bible','KIAS Music','Money Lab','Web Apps & Novels','Skills & Learning','Health & Body','Love & Family'];
const SEED={'God & Spirit':[['Morning prayer & worship','process'],['Bible reading (1 chapter)','process'],['Psalm meditation','process'],['Evening gratitude prayer','process']],'KIAS Bible':[['Write 500+ words - The Bible is Amazing','outcome'],['Record/edit one Bible YouTube video','outcome'],['Bible app - 1 feature/task','outcome']],'KIAS Music':[['Compose or refine one worship track','outcome'],['Studio session','process']],'Money Lab':[['Review open trades & risk','process'],['Newsletter - write/research','outcome'],['Global macro analysis','learning']],'Web Apps & Novels':[['Code session','process'],['Write fiction (500+ words)','outcome']],'Skills & Learning':[['Chinese study - 30 min','learning'],['Coding - 45 min','learning'],['Law/economics reading - 20 min','learning']],'Health & Body':[['Exercise / sport session','process'],['Clean diet','process'],['Meditation - 10 min','process'],['Sleep before midnight','process']],'Love & Family':[['Character work - read/reflect','learning'],['Social/community time','process']]};
const DSET={tz:'Africa/Harare',snd:'chime',dur:8,notif:true,vib:true,iv:15,workM:25,breakM:5,mode:'focus',dailyAt:'21:00',weeklyDay:0,weeklyAt:'18:00',lang:'en-US',gtok:'',gid:''};
const KD=['creation','research','editing','publishing','admin','interruption','break'],PLT=['Instagram','Facebook','YouTube','Webfiction','Other'];
function seed(){const h=[];for(const c in SEED)SEED[c].forEach(([t,ty])=>h.push({id:uid(),t,cat:c,type:ty,u:1}));const y=dstr(),n=new Date();
return{ts:Date.now(),goals:[{id:uid(),t:'Finish novel first draft',h:'year',type:'outcome',cat:'Web Apps & Novels',target:80000,unit:'words',cur:0,start:y,due:dstr(new Date(n.getFullYear()+1,n.getMonth(),n.getDate())),ms:[],u:1},{id:uid(),t:'Chinese practice',h:'month',type:'learning',cat:'Skills & Learning',target:600,unit:'min',cur:0,start:y,due:dstr(new Date(n.getFullYear(),n.getMonth()+1,n.getDate())),ms:[],u:1}],habits:h,done:{},log:[],notes:[],reviews:[],set:{...DSET}}}
let S;try{S=JSON.parse(localStorage[K]);S.set={...DSET,...S.set}}catch(e){S=seed()}S.posts=S.posts||[];S.set.cyc=S.set.cyc||{outcome:'',process:'',learning:''};
let tab='today',hz='all',T=JSON.parse(localStorage[K+'t']||'null'),SND=JSON.parse(localStorage[K+'snd']||'{}'),pend=null;
function save(push=true){S.ts=Date.now();try{localStorage[K]=JSON.stringify(S)}catch(e){toast('Storage full - export a backup in More',6)}if(push){clearTimeout(pend);pend=setTimeout(sync,4000)}}
function saveT(){localStorage[K+'t']=JSON.stringify(T)}
/* ---------- sounds (all 10 originals + custom) ---------- */
let AC;const N={beep:[[800,0,.2]],chime:[[523,0,.2],[659,.1,.2],[784,.2,.35]],bell:[[1000,0,.9]],ping:[[600,0,.3]],alarm:[0,.3,.6].map(t=>[1200,t,.2]),ding:[[1500,0,.4,.2]],gong:[[200,0,1.5,.4]],whistle:[[2000,0,.3,.2,3000]],marimba:[523,659,784,1046].map((f,i)=>[f,i*.15,.3]),harp:[392,494,587,784,988].map((f,i)=>[f,i*.12,.6,.2])};
const SN={beep:'Beep (short)',chime:'Chime (pleasant)',bell:'Bell (classic)',ping:'Ping (soft)',alarm:'Alarm (loud)',ding:'Ding (subtle)',gong:'Gong (deep)',whistle:'Whistle (sharp)',marimba:'Marimba (musical)',harp:'Harp (gentle)'};
function play(t){try{if(SND[t]){new Audio(SND[t].d).play();return}AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime;(N[t]||N.chime).forEach(([f,s,d,v=.3,e])=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(f,n+s);if(e)o.frequency.exponentialRampToValueAtTime(e,n+s+d);g.gain.setValueAtTime(v,n+s);g.gain.exponentialRampToValueAtTime(.01,n+s+d);o.start(n+s);o.stop(n+s+d)})}catch(e){}}
/* ---------- motivation / gamification ---------- */
const Q={start:['Begin. Momentum is built, not found.','Commit to the Lord whatever you do, and He will establish your plans. (Prov 16:3)','One focused block now moves {g} closer.','Small and steady beats big and rare. Start the clock.'],win:['That block counts. {g} just moved.','Stack another. Your future self is watching this.','Proof, not hope: you showed up.','Every minute logged is a vote for who you are becoming.'],push:['Stay with it - you are closer than it feels.','Discipline is a gift to the person you will be at the finish.','Do the next small thing. Then the next.','Breathe, refocus, continue. {g} needs you.'],done:['Finished. Take it in - you earned that.','Another one off the list. The streak grows.','That is how kingdoms are built: finished tasks, one by one.'],rest:['Rest is part of the work. Breathe.','Water, stretch, eyes off the screen.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mot(k){const g=topGoal();return pick(Q[k]).replace('{g}',g?'"'+g.t+'"':'your goals')}
function xp(){return Object.values(S.done).reduce((a,x)=>a+x.length*10,0)+S.log.reduce((a,l)=>a+(l.min||0),0)+S.goals.reduce((a,g)=>a+g.ms.filter(m=>m.done).length*25,0)+S.reviews.length*20+S.notes.length*2}
const lvl=()=>{const x=xp(),l=Math.floor(Math.sqrt(x/50))+1;return{l,x,lo:50*(l-1)**2,hi:50*l*l}};
/* ---------- helpers ---------- */
const act=a=>a.filter(x=>!x.arch),td=()=>dstr();
const minsOn=d=>S.log.filter(l=>dstr(new Date(l.ts))===d).reduce((a,l)=>a+l.min,0);
function streak(){let n=0,d=new Date();if(!(S.done[dstr(d)]||[]).length&&!minsOn(dstr(d)))d.setDate(d.getDate()-1);for(;;){const k=dstr(d);if((S.done[k]||[]).length||minsOn(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function proj(g){if(!g.target)return{pct:0,txt:'Add a target to see projections'};const pct=Math.min(100,g.cur/g.target*100);if(g.cur>=g.target)return{pct:100,txt:'Complete - well done!',ok:1};const now=new Date(),el=Math.max(1,(now-new Date(g.start+'T00:00'))/864e5),rate=g.cur/el,left=g.target-g.cur;let t='';let ok=1;if(rate>0){const eta=new Date(+now+left/rate*864e5);t='At your pace: done ~'+eta.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}else t='No progress yet - first step starts the projection';if(g.due){const dl=Math.ceil((new Date(g.due+'T23:59')-now)/864e5);if(dl<0){t+=' | overdue';ok=0}else{const need=left/Math.max(1,dl);t+=' | need '+(need<10?need.toFixed(1):Math.round(need))+' '+g.unit+'/day for '+dl+' days';if(rate>0&&new Date(+now+left/rate*864e5)>new Date(g.due+'T23:59'))ok=0}}return{pct,txt:t,ok}}
function topGoal(){const a=act(S.goals).filter(g=>g.target&&g.cur<g.target);let b=null,bs=-9e9;a.forEach(g=>{let s=0;if(g.due){const tot=Math.max(1,new Date(g.due)-new Date(g.start)),el=Math.min(1,(Date.now()-new Date(g.start))/tot);s=el*100-proj(g).pct}s+=({day:5,week:4,month:3,quarter:2,year:1}[g.h]||0);if(s>bs){bs=s;b=g}});return b}
function suggest(){const g=topGoal();const cm={};act(S.habits).forEach(h=>cm[h.cat]=cm[h.cat]||0);const w=Date.now()-7*864e5;S.log.filter(l=>l.ts>w).forEach(l=>cm[l.cat]=(cm[l.cat]||0)+l.min);const low=Object.entries(cm).sort((a,b)=>a[1]-b[1])[0];let s='';if(g)s+='Priority: <b>'+esc(g.t)+'</b> ('+esc(g.h)+', '+Math.round(proj(g).pct)+'%). Give it one 25 min block now. ';if(low&&low[1]<30)s+='Neglected this week: <b>'+esc(low[0])+'</b> - even 15 minutes keeps it alive.';return s||'Add a goal to get suggestions.'}
function toast(h,sec=3){const e=document.createElement('div');e.className='toast';e.innerHTML=h;$('toasts').appendChild(e);if(sec)setTimeout(()=>e.remove(),sec*1000);return e}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m);return m}
/* ---------- dictation ---------- */
let rec=null;function dict(id,b){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Dictation needs Chrome, Edge or Safari. On a phone you can also use the keyboard mic.',5);if(rec){rec.stop();return}rec=new R();rec.continuous=true;rec.lang=S.set.lang;rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';const el=$(id);el.value=(el.value+' '+t).trim()};rec.onend=()=>{rec=null;document.querySelectorAll('.mic').forEach(x=>x.classList.remove('on'))};b.classList.add('on');rec.start()}
const mic=id=>`<button class="mic" title="Dictate" onclick="dict('${id}',this)">&#127908;</button>`;
/* ---------- log ---------- */
function addLog(o){const e={id:uid(),ts:Date.now(),u:Date.now(),min:0,t:'',cat:'',type:'process',planned:true,goal:'',kind:'creation',est:0,...o};S.log.push(e);const g=S.goals.find(x=>x.id===e.goal);if(g&&e.min){const u=(g.unit||'').toLowerCase();g.cur+=u.startsWith('min')?e.min:u.startsWith('h')?e.min/60:0;g.u=Date.now()}save();return e}
function capLog(){const t=$('cn').value.trim(),m=+$('cm').value||0;if(!t&&!m)return toast('Write what you did or add minutes');addLog({t,min:m,cat:$('cc').value.trim(),type:$('ct').value,planned:$('cp').checked,goal:$('cg').value,kind:$('ck').value,est:+$('ce').value||0});toast(mot('win'),4);render()}
const goalOpts=()=>'<option value="">no goal</option>'+act(S.goals).map(g=>`<option value="${g.id}">${esc(g.t)}</option>`).join('');
const cap=()=>`<div class="card"><h3>Log what you did</h3><div class="row"><input id="cn" placeholder="What did you do? Plan or spontaneous - tap the mic to speak">${mic('cn')}</div><div class="row"><input id="cm" type="number" min="0" placeholder="minutes" style="max-width:90px"><input id="ce" type="number" min="0" placeholder="est. min" style="max-width:90px"><select id="ck" style="max-width:130px">${KD.map(k=>`<option>${k}</option>`).join('')}</select><input id="cc" list="cats" placeholder="category"><select id="cg">${goalOpts()}</select></div><div class="row"><label><input type="checkbox" id="cp" checked> on plan (untick = spontaneous / opportunity)</label><select id="ct" style="max-width:130px">${TY.map(t=>`<option>${t}</option>`).join('')}</select><button class="pri" onclick="capLog()">Log it</button></div></div>`;
/* ---------- views ---------- */
function vToday(){const d=td(),dn=S.done[d]||[],hs=act(S.habits),pct=hs.length?Math.round(dn.filter(i=>hs.some(h=>h.id===i)).length/hs.length*100):0,L=lvl(),cats=[...new Set(hs.map(h=>h.cat))];
let h=`<div class="card"><div class="row"><div class="big" style="color:var(--gold)">${pct}%</div><div style="flex:1"><div class="sub">habits done today</div><div class="bar"><i style="width:${pct}%"></i></div></div></div><div class="row sub"><span>&#128293; ${streak()} day streak</span><span>&#9201; ${minsOn(d)} min today</span><span>Level ${L.l} - ${L.x} XP</span></div><div class="bar"><i style="width:${(L.x-L.lo)/(L.hi-L.lo)*100}%;background:var(--gold)"></i></div></div>`+revBanner()+`<div class="card mot" id="motc">${esc(mot(pct>=100?'done':pct>0?'win':'start'))}</div><div class="card"><h3>What to do next</h3><div>${suggest()}</div></div>`+cap();
CL=cats;cats.forEach((c,ci)=>{h+=`<div class="card"><div class="row" style="margin-top:0"><h3 style="flex:1;margin:0">${esc(c)}</h3><button class="sm pri" title="Add to ${esc(c)}" onclick="$('ac${ci}').style.display=$('ac${ci}').style.display?'':'flex';$('an${ci}').focus()">+</button></div><div class="row" id="ac${ci}" style="display:none"><input id="an${ci}" placeholder="New item" onkeydown="if(event.key==='Enter')addIn(${ci})">${mic('an'+ci)}<select id="at${ci}">${TY.map(t=>`<option>${t}</option>`).join('')}</select><button class="pri sm" onclick="addIn(${ci})">Add</button></div>`+hs.filter(x=>x.cat===c).map(x=>{const k=dn.includes(x.id);return`<div class="hab ${k?'d':''}"><input type="checkbox" ${k?'checked':''} onchange="tog('${x.id}')"><span style="flex:1">${esc(x.t)}</span>${x.blk?`<span class="tag" style="color:var(--red);cursor:pointer" title="Tap to unblock" onclick="unblk('${x.id}')">blocked</span>`:''}<button class="sm" title="Start a focus session on this" onclick="startOn('${x.id}')">&#9654;</button><span class="tag ${x.type}">${x.type}</span><button class="sm" title="Rename" onclick="ren('${x.id}')">&#9998;</button><button class="sm" title="Remove (kept in history)" onclick="arch('habits','${x.id}')">&#10005;</button></div>`}).join('')+'</div>'});
return h+`<div class="card"><h3>Add a habit / daily task</h3><div class="row"><input id="hn" placeholder="Task">${mic('hn')}<input id="hc" list="cats" placeholder="category"><select id="ht">${TY.map(t=>`<option>${t}</option>`).join('')}</select><button class="pri" onclick="addHab()">Add</button></div></div>`}
function tog(id){const d=td();S.done[d]=S.done[d]||[];const i=S.done[d].indexOf(id);if(i<0){S.done[d].push(id);save();render();compNote('habit',id)}else{S.done[d].splice(i,1);save();render()}}
let CL=[];function addIn(i){const el=$('an'+i),t=el.value.trim();if(!t)return;S.habits.push({id:uid(),t,cat:CL[i],type:$('at'+i).value,u:Date.now()});save();render();toast('Added to '+CL[i],2)}
function ren(id){const h=S.habits.find(x=>x.id===id),t=prompt('Rename',h.t);if(t&&t.trim()){h.t=t.trim();h.u=Date.now();save();render()}}
function addHab(){const t=$('hn').value.trim();if(!t)return;S.habits.push({id:uid(),t,cat:$('hc').value.trim()||'General',type:$('ht').value,u:Date.now()});save();render()}
function arch(k,id){const x=S[k].find(i=>i.id===id);x.arch=1;x.u=Date.now();save();render();toast('Archived - restore anytime in More',3)}
function balance(){const a=act(S.goals),n=a.length;if(n<3)return'';const c=TY.map(t=>a.filter(g=>g.type===t).length),m=['outcome','process','learning'];const hi=c.findIndex(x=>x/n>.6),lo=c.findIndex(x=>x/n<.15);let w='';if(hi>-1)w=`${Math.round(c[hi]/n*100)}% of your goals are ${m[hi]} goals - the plan is leaning one way.`;if(lo>-1)w+=` You have few ${m[lo]} goals${m[lo]==='process'?' (habits that make results repeatable)':m[lo]==='learning'?' (skills that compound)':' (measurable results)'}.`;return w?`<div class="card warn">&#9878; ${w}</div>`:''}
function vGoals(){const L=act(S.goals).filter(g=>hz==='all'||g.h===hz);let h=`<div class="row">${['all',...HZ].map(x=>`<button class="sm ${hz===x?'pri':''}" onclick="hz='${x}';render()">${x}</button>`).join('')}</div>`+balance();
h+=`<div class="card"><h3>New goal</h3><div class="row"><input id="gt" placeholder="Goal (any size, any timeframe)">${mic('gt')}</div><div class="row"><select id="gh">${HZ.map(x=>`<option>${x}</option>`).join('')}</select><select id="gy">${TY.map(x=>`<option>${x}</option>`).join('')}</select><input id="gc" list="cats" placeholder="category"></div><div class="row"><input id="gg" type="number" placeholder="target" style="max-width:100px"><input id="gu" placeholder="unit (min, words, $, pages)" style="max-width:190px"><input id="gd" type="date" title="due date"><button class="pri" onclick="addGoal()">Add</button></div><div class="sub">Outcome = a result. Process = a repeated action. Learning = a skill gained.</div></div>`;
if(!L.length)h+='<div class="card sub">No goals here yet. Add one above - everything projects from it.</div>';

return`<div class="card"><h3>Progress overview</h3><b>Today's top 3</b>`+li(top.map(g=>`<div class="sub">${esc(g.t)} - ${Math.round(proj(g).pct)}%</div>`))+`<b>Deadlines (14 days)</b>`+li(dl.map(([d,g])=>`<div class="sub" style="color:${d<0?'var(--red)':'var(--mut)'}">${esc(g.t)} - ${d<0?-d+' days overdue':d+' days left'}</div>`))+`<b>Blocked work</b>`+li(bl.map(x=>`<div class="sub" style="color:var(--red)">${esc(x)}</div>`))+`<b>Progress by project</b>`+li(Object.entries(pc).map(([c,v])=>{const a=Math.round(v.reduce((x,y)=>x+y,0)/v.length);return`<div class="row" style="margin:3px 0"><span style="width:150px">${esc(c)}</span><div class="bar" style="flex:1"><i style="width:${a}%"></i></div><span class="sub">${a}%</span></div>`}))+`<b>Recent activity</b>`+li(rec.map(r=>`<div class="sub">${new Date(r[0]).toLocaleDateString()} - ${esc(r[1])}</div>`))+'</div>'}
const cy=k=>esc((S.set.cyc||{})[k]||''),setCy=(k,v)=>{S.set.cyc=S.set.cyc||{};S.set.cyc[k]=v;save()};
function cycle(){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7).getTime(),b=a+5*864e5,L=S.log.filter(l=>l.ts>=a&&l.ts<b),min=L.reduce((x,l)=>x+l.min,0);let hd=0;for(let i=0;i<5;i++)hd+=(S.done[dstr(new Date(a+i*864e5))]||[]).length;const E=L.filter(l=>l.est>0),acc=E.length?Math.round(E.reduce((x,l)=>x+Math.max(0,1-Math.abs(l.min-l.est)/l.est),0)/E.length*100)+'%':'-',P=S.posts.filter(p=>p.ts>=a&&p.ts<b),ty=TY.map(t=>t+' '+L.filter(l=>l.type===t).reduce((x,l)=>x+l.min,0)+'m').join(' / '),cn=S.notes.filter(n=>n.kind==='completion'&&n.ts>=a&&n.ts<b).length,bl=act(S.habits).filter(x=>x.blk).length;
const T3=['outcome','process','learning'].map(k=>`<div class="row"><span class="tag ${k}" style="width:76px">${k}</span><input value="${cy(k)}" placeholder="This cycle's ${k} target" onchange="setCy('${k}',this.value)"></div>`).join('');
return`<div class="card"><h3>This Mon-Fri cycle</h3>${T3}<div class="row">`+[min+' min focus',L.length+' sessions',hd+' habits done',cn+' completion notes','estimate accuracy '+acc,P.length+' posts, reach '+P.reduce((x,p)=>x+(+p.reach||0),0),bl+' blocked'].map(x=>`<span class="chip" style="font-size:13px;color:var(--tx)">${x}</span>`).join('')+`</div><div class="sub">${ty}. Friday: run your weekly review and carry the lessons into Monday.</div></div>`}
let FD='';function fractal(){const d=FD||td(),s0=+new Date(d+'T00:00'),sl=Array(96).fill(0);S.log.forEach(l=>{const a=l.ts-l.min*6e4;for(let i=0;i<96;i++){const x=s0+i*9e5,o=Math.min(l.ts,x+9e5)-Math.max(a,x);if(o>0)sl[i]+=o/6e4}});const tot=Math.round(sl.reduce((x,y)=>x+y,0)),hh=Array.from({length:24},(_,i)=>sl.slice(i*4,i*4+4).reduce((x,y)=>x+y,0)),best=hh.indexOf(Math.max(...hh));let g='';
for(let r=0;r<6;r++){const seg=sl.slice(r*16,r*16+16);g+=`<div class="row" style="margin:3px 0;flex-wrap:nowrap"><span class="sub" style="width:84px">${String(r*4).padStart(2,'0')}-${String(r*4+4).padStart(2,'0')}h</span><div class="heat" style="flex:1;grid-template-columns:repeat(16,1fr)">${seg.map((v,i)=>{const q=r*16+i;return`<i title="${String(q>>2).padStart(2,'0')}:${String(q%4*15).padStart(2,'0')} - ${Math.round(v)} min" style="background:${v>0?`rgba(232,182,76,${.25+Math.min(1,v/15)*.75})`:''}"></i>`}).join('')}</div><span class="sub" style="width:48px;text-align:right">${Math.round(seg.reduce((x,y)=>x+y,0))}m</span></div>`}
return`<div class="card"><h3>Day, 4-hour, hour and 15-minute view</h3><div class="row"><input type="date" id="fd" value="${d}" onchange="FD=this.value;document.activeElement.blur();render()"><span class="sub">${tot} min that day${tot?'. Best hour: '+String(best).padStart(2,'0')+':00 ('+Math.round(hh[best])+' min)':''}</span></div>${g}<div class="sub">Each row is a 4-hour block; each square is 15 minutes (darker = more focused time).</div></div>`}
function kinds(){const L=S.log.filter(l=>l.ts>Date.now()-30*864e5),t=L.reduce((a,l)=>a+l.min,0)||1;return`<div class="card"><h3>Where the time goes (30 days)</h3>`+KD.map(k=>{const v=L.filter(l=>(l.kind||'creation')===k).reduce((a,l)=>a+l.min,0);return`<div class="row"><span style="width:92px">${k}</span><div class="bar" style="flex:1"><i style="width:${v/t*100}%;background:${k==='interruption'?'var(--red)':'var(--blu)'}"></i></div><span class="sub">${v}m</span></div>`}).join('')+'</div>'}
function posts(){return`<div class="card"><h3>Distribution (posts)</h3><div class="sub">Log each post and its results. Kingdom Flow cannot log in to or post on your social accounts - this is your own record of what you published.</div><div class="row"><input id="pp" list="plt" placeholder="Platform"><datalist id="plt">${PLT.map(x=>`<option>${x}</option>`).join('')}</datalist><input id="pq" placeholder="What you posted"></div><div class="row"><input id="pu" placeholder="Link"><input id="pr" type="number" placeholder="reach" style="max-width:90px"><input id="pk" type="number" placeholder="clicks" style="max-width:90px"><button class="pri" onclick="addPost()">Add</button></div>`+[...S.posts].sort((a,b)=>b.ts-a.ts).slice(0,8).map(x=>`<div class="hab"><span style="flex:1">${esc(x.pl)}: ${esc(x.t)}<div class="sub">${new Date(x.ts).toLocaleDateString()} - reach ${x.reach||0}, clicks ${x.clicks||0}</div></span><button class="sm" onclick="postEd('${x.id}')">update</button></div>`).join('')+'</div>'}
function addPost(){const t=$('pq').value.trim();if(!t)return toast('Say what you posted');S.posts.push({id:uid(),ts:Date.now(),u:Date.now(),pl:$('pp').value.trim()||'Other',t,url:$('pu').value.trim(),reach:+$('pr').value||0,clicks:+$('pk').value||0});save();render();toast(mot('win'),3)}
function postEd(id){const x=S.posts.find(p=>p.id===id),r=prompt('Reach',x.reach||0);if(r===null)return;const c=prompt('Clicks',x.clicks||0);x.reach=+r||0;x.clicks=+c||0;x.u=Date.now();save();render()}
function lsearch(q){q=q.toLowerCase().trim();const o=$('lres');if(!q){o.innerHTML='';return}const R=[...S.log.map(l=>[l.ts,l.t,'activity']),...S.notes.map(l=>[l.ts,l.t,'note']),...S.reviews.map(l=>[l.ts,l.wins+' '+l.block+' '+l.next,l.kind+' review']),...S.posts.map(l=>[l.ts,l.pl+' '+l.t+' '+l.url,'post'])].filter(r=>(r[1]||'').toLowerCase().includes(q)).sort((a,b)=>b[0]-a[0]).slice(0,30);o.innerHTML=R.map(r=>`<div class="sub" style="padding:4px 0;border-top:1px solid #1f3f4a">${new Date(r[0]).toLocaleDateString()} (${r[2]}) ${esc(r[1])}</div>`).join('')||'<div class="sub">No matches</div>'}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl('kingdom-flow-log-'+td()+'.csv',['date,minutes,estimate,kind,type,planned,category,note',...S.log.map(l=>[dstr(new Date(l.ts)),l.min,l.est||0,l.kind||'',l.type,l.planned,q(l.cat),q(l.t)].join(','))].join('\n'),'text/csv')}
function rep(){const w=Date.now()-7*864e5,L=S.log.filter(l=>l.ts>w),m=L.reduce((a,l)=>a+l.min,0);let t='# Weekly report - '+td()+'\n\nFocus: '+m+' min in '+L.length+' sessions\n'+TY.map(y=>'- '+y+': '+L.filter(l=>l.type===y).reduce((a,l)=>a+l.min,0)+' min').join('\n')+'\n\n## Goals\n'+act(S.goals).map(g=>'- '+g.t+' ('+g.h+'): '+Math.round(proj(g).pct)+'% - '+proj(g).txt).join('\n')+'\n\n## Completion notes\n'+S.notes.filter(n=>n.kind==='completion'&&n.ts>w).map(n=>'- '+n.t).join('\n')+'\n\n## Posts\n'+S.posts.filter(p=>p.ts>w).map(p=>'- '+p.pl+': '+p.t+' (reach '+(p.reach||0)+')').join('\n')+'\n\n## Blocked\n'+act(S.habits).filter(x=>x.blk).map(x=>'- '+x.t).join('\n')+'\n';dl('weekly-report-'+td()+'.md',t,'text/markdown')}
/* ---------- reviews ---------- */
function revDue(){const n=new Date(),d=dstr(n),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),s=S.set;if(sessionStorage.snz>Date.now())return null;if(hm>=s.dailyAt&&!S.reviews.some(r=>r.kind==='daily'&&r.d===d))return'daily';if(n.getDay()==s.weeklyDay&&hm>=s.weeklyAt&&!S.reviews.some(r=>r.kind==='weekly'&&r.d===d))return'weekly';return null}
const revBanner=()=>{const r=revDue();return r?`<div class="card warn">Your ${r} review is due. <button class="pri sm" onclick="review('${r}')">Review now</button></div>`:''};
let revOpen=0;function checkRev(){if(revOpen||!document.hasFocus())return;const r=revDue();if(r){revOpen=1;review(r)}}
function review(kind){revOpen=1;const d=td(),days=kind==='weekly'?7:1,since=Date.now()-days*864e5,mins=S.log.filter(l=>l.ts>since).reduce((a,l)=>a+l.min,0);let hd=0;for(let i=0;i<days;i++){const x=new Date();x.setDate(x.getDate()-i);hd+=(S.done[dstr(x)]||[]).length}
const m=modal(`<h3>${kind==='weekly'?'Weekly':'Daily'} review</h3><div class="sub">${mins} min logged - ${hd} habits completed. ${esc(mot('win'))}</div><div class="row"><textarea id="rw" placeholder="Wins - what went well?"></textarea>${mic('rw')}</div><div class="row"><textarea id="rb" placeholder="Blockers - what slowed you?"></textarea>${mic('rb')}</div><div class="row"><textarea id="rn" placeholder="${kind==='weekly'?'Next week: top priorities':'Tomorrow: top 3'}"></textarea>${mic('rn')}</div><div class="row"><label>Rating</label><select id="rr">${[5,4,3,2,1].map(i=>`<option>${i}</option>`).join('')}</select><span style="flex:1"></span><button id="rl">Later</button><button class="pri" id="rs">Save review</button></div>`);
m.querySelector('#rl').onclick=()=>{sessionStorage.snz=Date.now()+30*6e4;m.remove();revOpen=0};m.querySelector('#rs').onclick=()=>{S.reviews.push({id:uid(),ts:Date.now(),u:Date.now(),kind,d,wins:$('rw').value,block:$('rb').value,next:$('rn').value,rating:+$('rr').value});save();m.remove();revOpen=0;toast('Review saved. +20 XP',4);render()}}
/* ---------- more / settings ---------- */
function vMore(){const s=S.set,ar=[...S.goals,...S.habits].filter(x=>x.arch);return`<div class="card"><h3>Review times</h3><div class="row"><label class="sub">Daily at</label><input type="time" value="${s.dailyAt}" onchange="S.set.dailyAt=this.value;save()"><label class="sub">Weekly on</label><select onchange="S.set.weeklyDay=+this.value;save()">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<option value="${i}" ${s.weeklyDay==i?'selected':''}>${d}</option>`).join('')}</select><input type="time" value="${s.weeklyAt}" onchange="S.set.weeklyAt=this.value;save()"></div><div class="row"><label class="sub">Dictation language</label><input value="${s.lang}" onchange="S.set.lang=this.value;save()" style="max-width:110px"></div></div>
<div class="card"><h3>Sync across your devices</h3><div class="sub">Uses a private GitHub Gist. Create a token at github.com/settings/tokens (classic, scope: gist). Paste the same token on every device; the Gist id fills in automatically on the first device - copy it to the others.</div><div class="row"><input type="password" id="gk" placeholder="GitHub token" value="${esc(s.gtok)}"></div><div class="row"><input id="gi" placeholder="Gist id (auto)" value="${esc(s.gid)}"><button class="pri" onclick="S.set.gtok=$('gk').value.trim();S.set.gid=$('gi').value.trim();save(false);sync(1)">Save & sync now</button></div></div>
<div class="card"><h3>Backup</h3><div class="row"><button onclick="exp()">Export JSON</button><button onclick="csv()">Export CSV</button><button onclick="rep()">Weekly report</button><label class="sub">Import (merges, never overwrites)</label><input type="file" accept=".json" onchange="imp(this)"></div></div>
<div class="card"><h3>Archived (restorable)</h3>`+(ar.map(x=>`<div class="hab"><span style="flex:1">${esc(x.t)}</span><button class="sm" onclick="unarch('${x.id}')">Restore</button></div>`).join('')||'<div class="sub">None. Nothing is ever hard-deleted.</div>')+`</div>`}
function unarch(id){[...S.goals,...S.habits].forEach(x=>{if(x.id===id){x.arch=0;x.u=Date.now()}});save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='kingdom-flow-'+td()+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=merge(S,JSON.parse(r.result));save();render();toast('Imported and merged')}catch(e){toast('Not a valid backup file')}};r.readAsText(f)}
/* ---------- sync (merge, never lose data) ---------- */
function merge(a,b){const m=(x=[],y=[])=>{const o={};[...x,...y].forEach(i=>{if(!o[i.id]||(i.u||0)>=(o[i.id].u||0))o[i.id]=i});return Object.values(o)},r={...a};['goals','habits','log','notes','reviews','posts'].forEach(k=>r[k]=m(a[k],b[k]));r.done={};[...Object.keys(a.done||{}),...Object.keys(b.done||{})].forEach(k=>r.done[k]=[...new Set([...(a.done[k]||[]),...((b.done||{})[k]||[])])]);const loc=S&&S.set;r.set=(a.ts||0)>=(b.ts||0)?a.set:{...b.set,gtok:loc.gtok,gid:loc.gid};r.set={...DSET,...r.set,gtok:loc.gtok,gid:loc.gid};r.ts=Math.max(a.ts||0,b.ts||0);return r}
let syncing=0;async function sync(manual){const s=S.set;if(!s.gtok||syncing||!navigator.onLine)return;syncing=1;$('syn').textContent='syncing...';const H={Authorization:'Bearer '+s.gtok,Accept:'application/vnd.github+json'};try{if(s.gid){const r=await fetch('https://api.github.com/gists/'+s.gid,{headers:H});if(!r.ok)throw new Error(r.status);const j=await r.json(),f=j.files['kflow.json'];if(f){const rm=JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content);S=merge(S,rm);save(false)}}
const body=JSON.stringify({description:'Kingdom Flow data',files:{'kflow.json':{content:JSON.stringify({...S,set:{...S.set,gtok:'',gid:''}})}}});
if(s.gid){const r=await fetch('https://api.github.com/gists/'+s.gid,{method:'PATCH',headers:H,body});if(!r.ok)throw new Error(r.status)}else{const r=await fetch('https://api.github.com/gists',{method:'POST',headers:H,body:JSON.stringify({...JSON.parse(body),public:false})});if(!r.ok)throw new Error(r.status);S.set.gid=(await r.json()).id;save(false);toast('Sync created. Copy this Gist id to your other devices: '+S.set.gid,0)}
$('syn').textContent='synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(manual)toast('Synced');render()}catch(e){$('syn').textContent='sync error';if(manual)toast('Sync failed ('+e.message+'). Check token and Gist id.',5)}syncing=0}
/* ---------- shell ---------- */
const TABS=[['today','Today'],['goals','Goals'],['timer','Timer'],['log','Log'],['ins','Insights'],['more','More']];
function render(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value&&tab!=='timer')return;
$('nav').innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');const L=lvl();$('lvl').textContent='Lv '+L.l+' - '+L.x+' XP';
const cats=[...new Set([...PIL,...S.habits.map(x=>x.cat),...S.goals.map(x=>x.cat),...S.log.map(x=>x.cat)])].filter(Boolean);$('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
$('main').innerHTML={today:vToday,goals:vGoals,timer:vTimer,log:vLog,ins:vIns,more:vMore}[tab]();tick()}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();if(!T){tab='timer';render();tStart()}}else if(e.ctrlKey&&e.key==='Escape'){e.preventDefault();if(T)tStop()}else if(e.ctrlKey&&e.key==='t'){e.preventDefault();alertNow('Test alert','This is how reminders look.')}});
const net=()=>$('off').style.display=navigator.onLine?'none':'block';addEventListener('online',()=>{net();sync()});addEventListener('offline',net);net();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(tick,1000);setInterval(sync,120000);render();sync();
</script></body></html>
